<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>PROJECT BIM AI - Tiến Độ Nền Đường</title>
				<link rel="stylesheet" href="style.css">
</head>
	<body>
		<div id="toolbar">
			<h3>PROJECT BIM AI</h3>
			<div class="input-group">
				<input type="text" id="taskName" placeholder="Tên công việc..." required="">
					<input type="date" id="startDate" required="">
						<input type="date" id="endDate" required="">
							<select id="taskLevel">
								<option value="Level 1">Công việc tổng thể</option>
								<option value="Level 2" selected="">Công việc chi tiết (Level 2)</option>
							</select>
							<button id="addTaskBtn">+ Thêm Đầu Việc</button>
							<button id="importBtn" class="btn-orange">📊 Nhập từ MS Project</button>
							<button id="sync3DBtn">Đồng bộ 3D</button>
						</div>
		</div>

		<div class="workspace">

			<div class="table-container">
				<table id="taskTable">
					<thead>
						<tr>
							<th style="width: 40px; text-align: center;">STT</th>
							<th style="width: 80px; text-align: center;">Task Mode</th>
							<th>Task Name</th>
							<th>Duration</th>
							<th>Start</th>
							<th>Finish</th>
							<th>Predecessors</th>
							<th>Resource Name</th>
							<th>Model > Name</th>
						</tr>
					</thead>
					<tbody id="taskTableBody">
					</tbody>
				</table>
			</div>

			<div class="gantt-container">
				<div class="gantt-header">
					<div style="margin-left: 60px; padding: 10px; font-size: 11px; color: #666; font-weight: bold;">
						Timeline Tiến Độ Kế Hoạch Thi Công
					</div>
				</div>
				<div id="ganttBody" class="gantt-body">
				</div>
			</div>

		</div>

		<script src="app.js"></script>
	</body>
</html>
