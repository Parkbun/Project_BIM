<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Tiến Độ Nền Đường (BIM & AI)</title>

				<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.css">
					<link rel="stylesheet" href="style.css">

						<script src="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.js"></script>
						<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
					</head>
	<body>
		<div id="toolbar">
			<h3>PROJECT BIM_AI</h3>
			<div class="input-group">
				<input type="text" id="taskName" placeholder="Tên công việc..." required="">
					<input type="date" id="taskStart" required="" title="Ngày bắt đầu">
						<input type="date" id="taskEnd" required="" title="Ngày kết thúc">
							<select id="taskLevel">
								<option value="0">Hạng mục chính (Level 0)</option>
								<option value="1">Hạng mục con (Level 1)</option>
								<option value="2" selected="">Công việc chi tiết (Level 2)</option>
							</select>
							<button id="btnAddTask">+ Thêm Đầu Việc</button>

							<button id="btnTogglePaste" style="background: #ff9800; margin-left: 15px; border-radius: 4px;">📋 Nhập từ MS Project</button>
						</div>
			<button id="btnSync">Đồng bộ 3D</button>
		</div>

		<div id="pasteArea" style="display: none; padding: 10px 20px; background: #fff3e0; border-bottom: 1px solid #ffcc80;">
			<p style="margin: 0 0 5px 0; font-size: 13px; color: #d84315;">
				<b>Cách dùng:</b> Bôi đen dữ liệu trong Project/Excel, <b>Ctrl+C</b> rồi click vào ô dưới đây bấm <b>Ctrl+V</b>. Cuối cùng nhấn Xác nhận.
			</p>
			<textarea id="pasteInput" rows="3" style="width: 100%; border: 1px solid #ffb74d; padding: 8px; font-family: monospace; border-radius: 4px;" placeholder="Dán dữ liệu của bạn vào đây..."></textarea>
			<div style="margin-top: 8px;">
				<button id="btnConfirmPaste" style="background: #e65100; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold;">✔️ Xác nhận Dán</button>
				<button id="btnClosePaste" style="background: #9e9e9e; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; margin-left: 5px;">❌ Hủy</button>
			</div>
		</div>

		<div class="workspace">
			<div class="table-container">
				<table id="projectTable">
					<thead>
						<tr>
							<th class="col-id"></th>
							<th class="col-icon">
								Task<br>Mode</th>
							<th class="col-name">Task Name</th>
							<th class="col-dur">Duration</th>
							<th class="col-date">Start</th>
							<th class="col-date">Finish</th>
							<th class="col-pred">Predecessors</th>
							<th class="col-res">Resource Names</th>
							<th class="col-model">Model &gt; Name</th>
							<th class="col-action"></th>
						</tr>
					</thead>
					<tbody id="tableBody">
					</tbody>
				</table>
			</div>
			<div class="gantt-container">
				<svg id="gantt-target"></svg>
			</div>
		</div>

		<script src="app.js"></script>
	</body>
</html>
